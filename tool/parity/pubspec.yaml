name: scape_parity_tool
description: >-
  Writes the fixtures the C# ports are checked against. Not a package anyone
  depends on.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  orblit_save:
    git:
      url: https://github.com/ChxisB/orblit.git
      path: packages/orblit_save
      ref: main
  scape_content:
    path: ../../packages/scape_content
  scape_core:
    path: ../../packages/scape_core
  scape_server:
    path: ../../packages/scape_server

dev_dependencies:
  lints: ^5.0.0
