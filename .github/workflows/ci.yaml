name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: orblit-scape

      # The engine and networking are separate repositories, so CI checks
      # them out and points the server at them rather than resolving git
      # dependencies. Both are public, so the default token reads them.
      - uses: actions/checkout@v4
        with:
          repository: ChxisB/orblit
          path: orblit

      - uses: actions/checkout@v4
        with:
          repository: ChxisB/orblit-net
          path: orblit-net

      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned: a formatter that moves under the repository turns an
          # unrelated SDK release into a red build.
          sdk: 3.13.0

      - name: Link the engine and networking
        working-directory: orblit-scape
        run: ./tool/link_local.sh ../orblit ../orblit-net

      - name: Check
        working-directory: orblit-scape
        run: ./tool/check.sh

  # Checks each commit on a pull request against commitlint.config.mjs.
  # Pull requests only, since a push to main has no range to check.
  commits:
    name: Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @commitlint/cli@21 --from "origin/$BASE_BRANCH" --to HEAD
        env:
          BASE_BRANCH: ${{ github.base_ref }}
