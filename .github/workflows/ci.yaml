name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: orblit-scape

      # The engine and networking are separate repositories, so CI checks
      # them out and points the server at them rather than resolving git
      # dependencies. Both are public, so the default token reads them.
      - uses: actions/checkout@v4
        with:
          repository: ChxisB/orblit
          path: orblit

      - uses: actions/checkout@v4
        with:
          repository: ChxisB/orblit-net
          path: orblit-net

      # Flutter 3.47.0 carries Dart 3.13.0. Both are pinned: a formatter that
      # moves under the repository turns an unrelated SDK release into a red
      # build. scape_panels is a Flutter package, and its goldens are drawn
      # with the Ahem test font, so one platform draws what another does.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true

      - name: Link the engine and networking
        working-directory: orblit-scape
        run: ./tool/link_local.sh ../orblit ../orblit-net

      - name: Check
        working-directory: orblit-scape
        run: ./tool/check.sh

  # Builds the server as a bundle, starts it, and stops it with SIGTERM. The
  # bundle holds the executable and the native library it loads, so it runs
  # on a machine with no Dart. It is kept as an artifact for a deploy.
  bundle:
    name: Server bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: orblit-scape
      - uses: actions/checkout@v4
        with:
          repository: ChxisB/orblit
          path: orblit
      - uses: actions/checkout@v4
        with:
          repository: ChxisB/orblit-net
          path: orblit-net
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true

      - name: Link the engine and networking
        working-directory: orblit-scape
        run: ./tool/link_local.sh ../orblit ../orblit-net

      - name: Build
        working-directory: orblit-scape/packages/scape_server
        run: dart build cli -t bin/scape_server.dart -o "$RUNNER_TEMP/build"

      - name: Smoke
        working-directory: orblit-scape
        run: ./deploy/smoke.sh "$RUNNER_TEMP/build/bundle"

      # The artifact action zips files and drops their permissions, so the
      # bundle goes up as a tarball that keeps the executable bit.
      - name: Pack
        run: tar -czf "$RUNNER_TEMP/scape-server-linux.tar.gz" -C "$RUNNER_TEMP/build" bundle

      - uses: actions/upload-artifact@v4
        with:
          name: scape-server-linux
          path: ${{ runner.temp }}/scape-server-linux.tar.gz

  # Checks each commit on a pull request against commitlint.config.mjs.
  # Pull requests only, since a push to main has no range to check.
  commits:
    name: Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @commitlint/cli@21 --from "origin/$BASE_BRANCH" --to HEAD
        env:
          BASE_BRANCH: ${{ github.base_ref }}
