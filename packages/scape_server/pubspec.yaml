name: scape_server
description: The headless game server, with its tick, sessions, actions and saves.
version: 0.21.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  cryptography: ^2.9.0
  orblit_core:
    git:
      url: https://github.com/ChxisB/orblit.git
      path: packages/orblit_core
      ref: main
  orblit_net:
    git:
      url: https://github.com/ChxisB/orblit-net.git
      ref: main
  orblit_dialogue:
    git:
      url: https://github.com/ChxisB/orblit.git
      path: packages/orblit_dialogue
      ref: main
  orblit_progress:
    git:
      url: https://github.com/ChxisB/orblit.git
      path: packages/orblit_progress
      ref: main
  orblit_quest:
    git:
      url: https://github.com/ChxisB/orblit.git
      path: packages/orblit_quest
      ref: main
  orblit_save:
    git:
      url: https://github.com/ChxisB/orblit.git
      path: packages/orblit_save
      ref: main
  scape_content:
    path: ../scape_content
  scape_core:
    path: ../scape_core

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
