name: scape_server
description: The headless game server, with its tick, sessions, actions and saves.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  orblit_core:
    git:
      url: https://github.com/ChxisB/orblit.git
      path: packages/orblit_core
      ref: main
  orblit_net:
    git:
      url: https://github.com/ChxisB/orblit-net.git
      ref: main
  scape_core:
    path: ../scape_core

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
