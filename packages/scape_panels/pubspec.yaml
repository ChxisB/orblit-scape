name: scape_panels
description: The panels of the orblit-scape client, built as orblit_ui trees.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  orblit_ui:
    git:
      url: https://github.com/ChxisB/orblit.git
      path: packages/orblit_ui
      ref: main
  scape_client:
    path: ../scape_client
  scape_core:
    path: ../scape_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
  orblit_net:
    git:
      url: https://github.com/ChxisB/orblit-net.git
      ref: main
  scape_content:
    path: ../scape_content
  scape_server:
    path: ../scape_server
